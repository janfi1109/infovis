<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualización de Consumo Cinematográfico 2026</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background-color: #faf8f5;
            color: #333;
            line-height: 1.6;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        section {
            margin-bottom: 40px;
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        h2 {
            font-size: 1.25rem;
            color: #2c3e50;
            border-left: 4px solid #2196F3;
            padding-left: 12px;
            margin-bottom: 20px;

        .chart-container {
            text-align: center;
        }

    <header>

    <!-- GRÁFICO 1: FLOURISH -->
    <section>
        <h2>¿Cuáles son las plataformas que más utilizo para ver películas?</h2>
        <div class="chart-container">
            <!-- CÓDIGO DE FLOURISH INTEGRADO -->
            <div class="flourish-embed flourish-hierarchy" data-src="visualisation/30107591"><script src="https://public.flourish.studio/resources/embed.js"></script><noscript><img src="https://public.flourish.studio/visualisation/30107591/thumbnail" width="100%" alt="hierarchy visualization" /></noscript></div>
        </div>
    </section>
<section>
